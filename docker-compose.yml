services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: imj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: imj_cockpit
      POSTGRES_USER: imj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - imj_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imj -d imj_cockpit"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imj-agent-cockpit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://imj:${POSTGRES_PASSWORD}@postgres:5432/imj_cockpit
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8501:8501"

volumes:
  imj_postgres_data:
